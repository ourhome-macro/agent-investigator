services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${CI_POSTGRES_DB:-deerflow}
      POSTGRES_USER: ${CI_POSTGRES_USER:-deerflow}
      POSTGRES_PASSWORD: ${CI_POSTGRES_PASSWORD:?set CI_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - deer-flow
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CI_S3_ACCESS_KEY:?set CI_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${CI_S3_SECRET_KEY:?set CI_S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - deer-flow
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CI_S3_ACCESS_KEY: ${CI_S3_ACCESS_KEY:?set CI_S3_ACCESS_KEY}
      CI_S3_SECRET_KEY: ${CI_S3_SECRET_KEY:?set CI_S3_SECRET_KEY}
      CI_S3_BUCKET: ${CI_S3_BUCKET:-deerflow-investigations}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://minio:9000 "$${CI_S3_ACCESS_KEY}" "$${CI_S3_SECRET_KEY}";
        mc mb --ignore-existing "local/$${CI_S3_BUCKET}";
    networks:
      - deer-flow
    restart: "no"

  gateway:
    build:
      args:
        UV_EXTRAS: ${UV_EXTRAS:-browser,redis}
    environment:
      - DEER_FLOW_ENV=production
      - DATABASE_URL=postgresql://${CI_POSTGRES_USER:-deerflow}:${CI_POSTGRES_PASSWORD}@postgres:5432/${CI_POSTGRES_DB:-deerflow}
      - CI_S3_ENDPOINT=http://minio:9000
      - CI_S3_BUCKET=${CI_S3_BUCKET:-deerflow-investigations}
      - CI_S3_REGION=${CI_S3_REGION:-us-east-1}
      - CI_S3_ACCESS_KEY=${CI_S3_ACCESS_KEY}
      - CI_S3_SECRET_KEY=${CI_S3_SECRET_KEY}
      - CI_CHROMIUM_PATH=/usr/bin/chromium
      - NO_PROXY=${NO_PROXY:-}${NO_PROXY:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,redis,postgres,minio,provisioner,host.docker.internal
      - no_proxy=${no_proxy:-}${no_proxy:+,}localhost,127.0.0.1,::1,gateway,frontend,nginx,redis,postgres,minio,provisioner,host.docker.internal
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
